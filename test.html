<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153d35">
  <meta name="description" content="Take a chapter-wise UGC-NET English practice test.">
  <title>Practice Test | Prep</title>
  <link rel="stylesheet" href="styles.css">
  <script src="firebase-config.js"></script>
  <script src="data/questions.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body data-page="test">
  <header class="site-header">
    <a class="brand" href="./" aria-label="Prep home"><span class="brand-mark" aria-hidden="true">P</span><span>prep</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="./">Chapters</a>
      <a class="active" href="test.html">Practice tests</a>
      <a href="flashcards.html">Flashcards</a>
    </nav>
    <span class="header-note" id="account-status">Registration required</span>
  </header>

  <main class="study-main">
    <section class="study-topline">
      <div>
        <a class="back-crumb" href="./">← All chapters</a>
        <p class="eyebrow eyebrow-dark">Chapter practice</p>
        <h1 id="test-title">Choose a chapter test</h1>

      <label class="chapter-picker">

    </section>
    <section id="test-app" class="test-shell" aria-live="polite"></section>
  </main>
  <footer class="site-footer">
    <a class="brand brand-footer" href="./"><span class="brand-mark" aria-hidden="true">P</span><span>prep</span></a>

    <a href="flashcards.html">Go to flashcards <span aria-hidden="true">→</span></a>

</html>
